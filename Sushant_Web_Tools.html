<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sushant Web Tools</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:lightblue;color:green}header{background:#222;color:white;text-align:center;padding:22px}header h1{margin:0 0 8px}nav{display:flex;justify-content:center;gap:10px;padding:15px;background:white;border-bottom:1px solid #ddd;flex-wrap:wrap}nav button{padding:12px 20px;border:none;border-radius:8px;cursor:pointer;background:#e5e7eb;font-size:16px}nav button:hover{background:#d1d5db}.page{display:none;max-width:900px;margin:25px auto;padding:20px}.page.active{display:block}.calculator{max-width:350px;margin:auto;background:white;padding:20px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1)}#display{box-sizing:border-box;width:100%;height:100px;font-size:28px;text-align:right;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:8px}.calc-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-buttons button{height:55px;font-size:20px;border:none;border-radius:8px;cursor:pointer;background:#e5e7eb}.calc-buttons button:hover{background:#d1d5db}.operator{background:#cbd5e1!important}.equal{background:#222!important;color:white}footer{text-align:center;padding:30px 15px;margin-top:30px;background:white;border-top:1px solid #ddd;line-height:1.8}footer .contact{margin-top:30px}@media(max-width:600px){.page{margin:10px auto;padding:12px}header h1{font-size:26px}nav button{font-size:14px;padding:10px 15px}}p{background-color:red;color:darkblue}
</style>
</head>
<body>
<header><h1>calculator</h1><p>USE THE MOST POWERFUL CALCULATOR</p></header>
<nav><button onclick="showPage('calculatorPage')">🧮 Calculator</button></nav>
<section id="calculatorPage" class="page active"><h2>🧮 Calculator</h2><div class="calculator"><input id="display" type="text" readonly><div class="calc-buttons">
<button onclick="clearDisplay()">C</button><button onclick="deleteLast()">⌫</button><button onclick="addValue('%')">%</button><button class="operator" onclick="addValue('/')">÷</button>
<button onclick="addValue('7')">7</button><button onclick="addValue('8')">8</button><button onclick="addValue('9')">9</button><button class="operator" onclick="addValue('*')">×</button>
<button onclick="addValue('4')">4</button><button onclick="addValue('5')">5</button><button onclick="addValue('6')">6</button><button class="operator" onclick="addValue('-')">−</button>
<button onclick="addValue('1')">1</button><button onclick="addValue('2')">2</button><button onclick="addValue('3')">3</button><button class="operator" onclick="addValue('+')">+</button>
<button onclick="addValue('0')">0</button><button onclick="addValue('.')">.</button><button class="equal" onclick="calculate()">=</button><button class="operator" onclick="addValue('**')">^</button>
</div></div></section>
<footer><div>This website is created by Sushant Singh from Moradabad.</div><div class="contact">If you also want to create your own website without using coding, contact 8958012786.<br>YOUR IDEA,YOUR MONEY,OUR HARDWORK,YOUR IMAGE!</div></footer>
<script>
function showPage(pageId){document.querySelectorAll('.page').forEach(page=>page.classList.remove('active'));document.getElementById(pageId).classList.add('active')}
function addValue(value){document.getElementById('display').value+=value}
function clearDisplay(){document.getElementById('display').value=''}
function deleteLast(){let display=document.getElementById('display');display.value=display.value.slice(0,-1)}
function calculate(){let display=document.getElementById('display');try{let expression=display.value;if(!expression)return;display.value=Function('"use strict"; return ('+expression+')')()}catch{display.value='Error'}}
</script>
</body>
</html>
